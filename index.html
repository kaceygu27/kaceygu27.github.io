<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kacey Gu · Portfolio</title>
<meta name="description" content="Kacey (Fangting) Gu 顾芳汀 — Columbia SIPA MPA, founder of UnLearning Education. Strategy, finance and business development.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3ecdf; --surface:#fbf7f0; --ink:#2b251e; --muted:#76695a; --line:#e2d6c3;
  --accent:#a8522f; --accent-soft:#efdccb; --chip:#ebe2d2;
  --serif:"Fraunces","Noto Serif SC",Georgia,serif;
  --sans:"Inter","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --max:1080px; --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
html[lang="zh"] body{line-height:1.8}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

/* nav */
header.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .top{display:flex;align-items:center;gap:20px;height:58px}
.brand{font:600 18px var(--serif);text-decoration:none;white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center;flex-shrink:0;margin-left:auto}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:none;color:var(--muted);font:500 13px var(--sans);padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -8px;padding:0 0 10px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex-shrink:0;text-decoration:none;font-size:14px;font-weight:500;color:var(--muted);padding:7px 14px;border-radius:999px;white-space:nowrap;transition:background .15s,color .15s}
.tabs a:hover{color:var(--ink);background:var(--chip)}
.tabs a[aria-current="page"]{background:var(--accent);color:#fff}

/* pages */
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;font-size:14px;font-weight:500;color:var(--muted);padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.pager a:hover{color:var(--accent);border-color:var(--accent)}
.pager .next{margin-left:auto}

/* hero */
.hero{padding:72px 0 56px}
.hero .wrap{display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:center}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font:600 clamp(38px,6vw,60px)/1.08 var(--serif);margin:10px 0 18px;letter-spacing:-.01em}
.tagline{font-size:19px;color:var(--muted);max-width:34em;margin:0 0 26px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.portrait{aspect-ratio:4/5;justify-self:end;width:100%;max-width:400px;border-radius:var(--r);overflow:hidden;background:var(--chip);box-shadow:0 20px 50px -25px rgba(0,0,0,.35)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.stat b{display:block;font:600 26px/1.1 var(--serif);color:var(--accent)}
.stat span{font-size:13px;color:var(--muted);line-height:1.35;display:block;margin-top:4px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:14px;color:var(--muted)}

/* sections */
section.block{padding:48px 0 64px}
.home-about{padding:8px 0 64px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:30px}
.sec-head .num{font:500 14px var(--serif);color:var(--accent)}
h2{font:600 clamp(26px,3.6vw,34px)/1.2 var(--serif);margin:0}
.sub{font:600 24px/1.3 var(--serif);margin:56px 0 22px;padding-top:36px;border-top:1px solid var(--line)}
.about p{font-size:18px;max-width:46em;margin:0 0 14px}

/* timeline */
.timeline{display:grid;gap:18px}
.item{display:grid;grid-template-columns:200px 1fr;gap:28px;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.item .when{font-size:14px;color:var(--muted)}
.item .where{font-size:14px;color:var(--muted);margin-top:2px}
.item h3{font:600 20px/1.3 var(--serif);margin:0 0 2px}
.item .role{color:var(--accent);font-weight:500;font-size:15px;margin-bottom:10px}
.item ul{margin:8px 0 0;padding-left:18px}
.item li{margin:4px 0}
.item .pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.item .pics .ph{aspect-ratio:4/3;border-radius:10px;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 40px -24px rgba(0,0,0,.35)}
.card .ph{aspect-ratio:16/10}
.card .body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.card .meta{font-size:13px;color:var(--muted)}
.card h3{font:600 20px/1.3 var(--serif);margin:4px 0 8px}
.card p{margin:0;color:var(--muted);font-size:15px}
.card ul{margin:10px 0 0;padding-left:18px;font-size:15px}
.card .more{margin-top:auto;padding-top:14px;font-size:14px;font-weight:500;color:var(--accent);text-decoration:none}

/* clickable timeline item + detail page */
.item.linked{cursor:pointer;transition:border-color .15s,box-shadow .2s}
.item.linked:hover{border-color:var(--accent);box-shadow:0 14px 34px -24px rgba(0,0,0,.35)}
.go{display:inline-flex;margin-top:14px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
.back{display:inline-block;margin-bottom:18px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none}
.back:hover{color:var(--accent)}
.intro{font-size:17px;color:var(--muted);max-width:46em;margin:-12px 0 30px}
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.event{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.event > .ph{aspect-ratio:16/10}
.event .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 6px 0}
.event .thumbs .ph{aspect-ratio:4/3;border-radius:6px;min-height:0}
.event .thumbs .ph.missing span{font-size:10px;padding:4px}
.event .body{padding:18px 22px 22px}
.event .kind{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:999px}
.event .date{font-size:13px;color:var(--muted);margin-top:10px}
.event h3{font:600 20px/1.3 var(--serif);margin:4px 0 8px}
.event p{margin:0;color:var(--muted);font-size:15px}

/* story page */
.story-lead{font:600 clamp(22px,3vw,28px)/1.35 var(--serif);margin:-6px 0 6px;color:var(--accent)}
.chapters{display:grid;gap:22px}
.chapter{display:grid;grid-template-columns:1fr 1.1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chapter:nth-child(even) .pic{order:2}
.chapter .pic .ph{height:100%;min-height:260px}
.chapter .pic figcaption{display:none}
.chapter .txt{padding:28px 30px;display:flex;flex-direction:column;justify-content:center}
.chapter .n{font:600 34px/1 var(--serif);color:var(--accent);opacity:.55}
.chapter h3{font:600 22px/1.3 var(--serif);margin:10px 0 10px}
.chapter p{margin:0;color:var(--ink)}
.chapter .cap{margin-top:14px;font-size:13px;color:var(--muted);font-style:italic}
.beliefs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.belief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.belief .ic{font-size:26px}
.belief h4{font:600 19px var(--serif);margin:10px 0 8px}
.belief p{margin:0;color:var(--muted);font-size:15px}
.gift{margin:0 0 24px;padding:22px 26px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0;font:500 18px/1.7 var(--serif)}
.funfacts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fact .ph{aspect-ratio:4/3}
.fact .body{padding:18px 22px 22px}
.fact h4{font:600 18px var(--serif);margin:0 0 8px}
.fact p{margin:0;color:var(--muted);font-size:15px}
.fact.noimg{display:flex;align-items:center;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fact.noimg h4{font-size:24px;line-height:1.3}
.fact.noimg p{color:color-mix(in srgb,var(--bg) 78%,transparent)}
.story-foot{text-align:center;color:var(--muted);margin:28px 0 0;font-size:15px;letter-spacing:.02em}

/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.skill h3{font:600 17px var(--serif);margin:0 0 12px}
.skill .tags{margin:0}
.skill .tag{font-size:13px;background:var(--accent-soft);color:var(--ink)}

/* gallery */
.gallery{columns:3 240px;column-gap:14px}
.gallery figure{margin:0 0 14px;break-inside:avoid;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.gallery figcaption{font-size:13px;color:var(--muted);padding:8px 12px}

/* image + placeholder */
.ph{position:relative;background:var(--chip);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.gallery .ph img{height:auto}
.ph.missing{display:flex;align-items:center;justify-content:center;min-height:140px;background:repeating-linear-gradient(45deg,var(--chip),var(--chip) 10px,var(--bg) 10px,var(--bg) 20px)}
.ph.missing span{font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);text-align:center;padding:10px;background:var(--surface);border-radius:8px;border:1px dashed var(--line)}

/* contact */
.contact{text-align:center;padding:80px 0}
.contact p{color:var(--muted);font-size:18px;margin:10px auto 24px;max-width:32em}
.contact .cta{justify-content:center}
footer{padding:28px 0 40px;text-align:center;font-size:13px;color:var(--muted)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-height:90vh;max-width:100%;border-radius:8px}
.zoomable img{cursor:zoom-in}

@media (max-width:860px){
  .hero{padding:40px 0}
  .hero .wrap{grid-template-columns:1fr;gap:28px}
  .portrait{max-width:300px;order:-1;justify-self:start}
  .item{grid-template-columns:1fr;gap:6px;padding:20px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .chapter{grid-template-columns:1fr}
  .chapter:nth-child(even) .pic{order:0}
  .chapter .pic .ph{aspect-ratio:16/10;min-height:0}
  .beliefs,.funfacts{grid-template-columns:1fr}
}
@media (max-width:480px){
  .wrap{padding:0 16px}
  .cards{grid-template-columns:1fr}
}
@media print{
  header.nav,.lb,.pager{display:none}
  .page{display:block!important}
  section.block{break-inside:avoid-page;padding:28px 0}
  .card:hover{transform:none}
}
</style>
</head>

  <section class="block page" data-page="gallery" id="gallery"><div class="wrap">

  <section class="block contact page" data-page="contact" id="contact"><div class="wrap">

</main>

<footer><div class="wrap" id="footer"></div></footer>
<div class="lb" id="lb"><img alt=""></div>

/* ---------- rendering ---------- */
let lang = "en";
const t = v => v == null ? "" : typeof v === "string" ? v : (v[lang] ?? v.en ?? "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const get = (o, path) => path.split(".").reduce((a, k) => a && a[k], o);
const $ = id => document.getElementById(id);

const ph = (src, cls = "") => src ? `<div class="ph zoomable ${cls}" data-img="${esc(src)}"></div>` : "";
const tags = arr => arr && arr.length ? `<div class="tags">${arr.map(x => `<span class="tag">${esc(t(x))}</span>`).join("")}</div>` : "";
const bullets = arr => arr && arr.length ? `<ul>${arr.map(b => `<li>${esc(t(b))}</li>`).join("")}</ul>` : "";

function timelineItem(it) {
  const pics = it.images && it.images.length ? `<div class="pics">${it.images.map(s => ph(s)).join("")}</div>` : "";
  const link = it.detail ? `<a class="go" href="#${esc(it.detail)}">${esc(t(UI.seeEvents))}</a>` : "";
  return `<article class="item${it.detail ? " linked" : ""}"${it.detail ? ` data-href="#${esc(it.detail)}"` : ""}>
    <div><div class="when">${esc(t(it.when))}</div><div class="where">${esc(t(it.where))}</div></div>
    <div><h3>${esc(t(it.title))}</h3><div class="role">${esc(t(it.role))}</div>
      ${bullets(it.bullets)}${tags(it.tags)}${pics}${link}</div>
  </article>`;
}

function render() {

  const all = { ...SITE, ...UI };
  document.querySelectorAll("[data-k]").forEach(el => el.textContent = t(get(all, el.dataset.k)));

  $("navlinks").innerHTML = pages().map(k => `<a href="#${k}" data-tab="${k}">${esc(t(UI.nav[k]))}</a>`).join("");
  renderPagers();

  const L = SITE.links;

    L.github && `<a class="btn" href="${esc(L.github)}" target="_blank" rel="noopener">GitHub</a>`
  ].filter(Boolean).join("");
  $("heroCta").innerHTML = ctas;
  $("contactCta").innerHTML = ctas;
  $("stats").innerHTML = (SITE.stats || []).map(s => `<div class="stat"><b>${esc(s.num)}</b><span>${esc(t(s.label))}</span></div>`).join("");
  $("facts").innerHTML = SITE.facts.map(f => `<span>${esc(t(f))}</span>`).join("");

  $("aboutBody").innerHTML = SITE.about.map(p => `<p>${esc(t(p))}</p>`).join("");
  $("eduList").innerHTML = SITE.education.map(timelineItem).join("");
  $("expList").innerHTML = SITE.experience.map(timelineItem).join("");
  $("leadList").innerHTML = SITE.leadership.map(timelineItem).join("");

  $("projList").innerHTML = SITE.projects.map(p => `<article class="card">
    ${ph(p.image)}
    <div class="body"><div class="meta">${esc(t(p.meta))}</div><h3>${esc(t(p.title))}</h3>
      <p>${esc(t(p.desc))}</p>${bullets(p.bullets)}${tags(p.tags)}

    </div></article>`).join("");

  $("gciEvents").innerHTML = (SITE.gci?.events || []).map(e => {
    const [first, ...rest] = e.images || [];
    return `<article class="event">${ph(first)}
      ${rest.length ? `<div class="thumbs">${rest.map(s => ph(s)).join("")}</div>` : ""}
      <div class="body"><span class="kind">${esc(t(e.type))}</span><div class="date">${esc(t(e.date))}</div>
        <h3>${esc(t(e.title))}</h3><p>${esc(t(e.desc))}</p></div></article>`;
  }).join("");

  const S = SITE.story;

  $("beliefs").innerHTML = S.beliefs.map(b => `<div class="belief"><div class="ic">${b.icon}</div><h4>${esc(t(b.title))}</h4><p>${esc(t(b.text))}</p></div>`).join("");

      <div class="body"><h4>${esc(t(f.title))}</h4><p>${esc(t(f.text))}</p></div></div>`).join("");

  $("galleryList").innerHTML = SITE.gallery.map(g => `<figure>${ph(g.src)}<figcaption>${esc(t(g.caption))}</figcaption></figure>`).join("");


  $("footer").textContent = `© ${new Date().getFullYear()} ${t(SITE.name)} · ${t(UI.footer)} ${document.lastModified.split(" ")[0]}`;

  loadImages();
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  showPage(false);
}

/* ---------- tabs: one module per page, driven by the URL hash ---------- */
const pages = () => [...document.querySelectorAll(".page:not([data-parent])")]
  .map(p => p.dataset.page)
  .filter(k => k !== "gallery" || SITE.gallery.length);
const current = () => { const h = location.hash.slice(1) === "leadership" ? "projects" : location.hash.slice(1); return pages().includes(h) || document.querySelector(`.page[data-parent][data-page="${CSS.escape(h)}"]`) ? h : "home"; };

function renderPagers() {
  const list = pages();
  document.querySelectorAll(".page:not([data-parent])").forEach(p => {
    const k = p.dataset.page, i = list.indexOf(k);
    const wraps = p.querySelectorAll(".wrap"), host = wraps[wraps.length - 1];
    let pg = host.querySelector(".pager");
    if (!pg) { pg = document.createElement("div"); pg.className = "pager"; host.appendChild(pg); }
    const prev = list[i - 1], next = list[i + 1];
    pg.innerHTML = (prev ? `<a href="#${prev}">${esc(t(UI.prev))} · ${esc(t(UI.nav[prev]))}</a>` : "") +
                   (next ? `<a class="next" href="#${next}">${esc(t(UI.next))} · ${esc(t(UI.nav[next]))} →</a>` : "");
  });
}

function showPage(scroll = true) {
  const k = current();
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.dataset.page === k));
  const tab = document.querySelector(`.page[data-page="${k}"]`)?.dataset.parent || k;
  document.querySelectorAll(".tabs a").forEach(a => {
    const on = a.dataset.tab === tab;
    on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
    if (on) a.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
  if (scroll) window.scrollTo({ top: 0 });
}

function loadImages() {
  document.querySelectorAll(".ph[data-img]").forEach(box => {
    const src = box.dataset.img;
    const img = new Image();
    img.alt = "";
    img.decoding = "async";
    img.onload = () => { box.classList.remove("missing"); box.innerHTML = ""; box.appendChild(img); };
    img.onerror = () => { box.classList.add("missing"); box.innerHTML = `<span>${esc(t(UI.addPhoto))}<br>${esc(src)}</span>`; };
    img.src = src;
  });
}

function setLang(l) {
  lang = l === "zh" ? "zh" : "en";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u);
  render();
}

/* language: ?lang=zh  >  saved choice  >  browser language */
(function init() {
  const q = new URLSearchParams(location.search).get("lang");
  let saved = null; try { saved = localStorage.getItem("lang"); } catch (e) {}
  lang = q || saved || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
  if (lang !== "zh") lang = "en";
  document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));

  window.addEventListener("hashchange", () => showPage());

  const lb = $("lb");
  document.addEventListener("click", e => {
    const img = e.target.closest(".zoomable img");
    if (img) { lb.querySelector("img").src = img.src; lb.classList.add("open"); return; }
    const card = e.target.closest(".item.linked");
    if (card && !e.target.closest("a")) { location.hash = card.dataset.href; return; }
    if (e.target.closest("#lb")) lb.classList.remove("open");
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("open"); });

  render();
})();
